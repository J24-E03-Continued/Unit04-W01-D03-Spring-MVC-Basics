<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List of Books</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<h1>Book List</h1>
<div th:each="book : ${books}"
     th:class="${book.isInStock()} ? 'book in-stock' : 'book out-of-stock'">
    <p><strong>Title:</strong> <span th:text="${book.getTitle()}"></span></p>
    <p><strong>Author:</strong> <span th:text="${book.getAuthor()}"></span></p>
    <p><strong>Year:</strong> <span th:text="${book.getYear()}"></span></p>
    <p><strong>Genre:</strong> <span th:text="${book.getGenre()}"></span></p>
    <p><strong>Price:</strong> €<span th:text="${book.getPrice()}"></span></p>
    <p th:if="${book.isInStock()}">In Stock</p>
    <p th:unless="${book.isInStock()}">Out of Stock</p>
    <hr/>
</div>

</body>
</html>
